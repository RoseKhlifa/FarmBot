run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gofmt

issues:
  exclude-use-default: false
  exclude-rules:
    - path: internal/config/paths_test\.go
      linters:
        - errcheck
    - path: internal/platform/logger/logger\.go
      linters:
        - errcheck
