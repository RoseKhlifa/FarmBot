services:
  farmbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: farmbot:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3007}:3007"
    volumes:
      - farmbot-data:/app/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ADMIN_PORT: 3007
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FARM_MASTER_KEY: ${FARM_MASTER_KEY:?FARM_MASTER_KEY must be set in .env or the shell}
      FARM_LICENSE_ENABLED: ${FARM_LICENSE_ENABLED:-false}
      FARM_DATA_DIR: /app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3007/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  farmbot-data:
